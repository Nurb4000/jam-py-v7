name: Package App with PyInstaller

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write  # IMPORTANT: mandatory for making GitHub Releases
  id-token: write  # IMPORTANT: mandatory for sigstore

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          utils/requirements.txt
          **/requirements.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from requirements.txt in utils folder
        pip install -r utils/requirements.txt

    - name: Prepare build folder (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Copy jam folder to demo
        xcopy jam demo\jam\ /E /H /C /I /Y
        # Copy utility scripts to demo
        xcopy utils\run.py demo\ /Y
        xcopy utils\asgi.py demo\ /Y
      shell: cmd

    - name: Prepare build folder (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        # Copy jam folder to demo
        cp -r jam demo/
        # Copy utility scripts to demo
        cp utils/run.py demo/
        cp utils/asgi.py demo/

    - name: Build Executable with PyInstaller
      run: |
        cd demo
        pyinstaller.exe -c -D --noupx --noconfirm --hidden-import duckdb --hidden-import databricks-sql-connector --hidden-import psycopg2 --hidden-import mysql-connector  --hidden-import pymssql --hidden-import sqlalchemy --hidden-import pyjsparser --hidden-import smtplib --hidden-import esprima --hidden-import jsmin --hidden-import sqlparse --hidden-import standard-imghdr --hidden-import werkzeug --hidden-import uvicorn --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on --hidden-import asgiref --hidden-import asgiref.wsgi --add-data "demo.sqlite;." --add-data "admin.sqlite;." --add-data "js;js" --add-data "css;css" --add-data "reports;reports" --add-data "jam;jam" --add-data "static;static" --add-data "index.html;." --add-data "templates.html;." --add-data "asgi.py;." run.py --name=jampy_windows_x86_64
      shell: cmd
          
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jampy-x86-64-windows
        path: demo/dist/jampy_windows_x86_64/*   

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            jampy_windows_x86_64.exe
            _internal/**
